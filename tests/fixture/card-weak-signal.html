<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>弱信号卡片识别自测页</title>
<style>
  body { font-family: sans-serif; }
  .row { padding: 12px 16px; border-bottom: 1px solid #eee; width: 400px; height: 40px; }
  .long { padding: 8px 16px; width: 400px; height: 30px; }
  .pointer { cursor: pointer; }
</style>
</head>
<body>
  <!-- 整页没有任何原生表单控件，用来触发 allowWeak 弱信号分支 -->

  <!-- 命中入口关键字：应被收为卡片 -->
  <div class="row resumer-common">教育经历 未完成</div>
  <div class="row resumer-common">工作经历 去完善</div>

  <!-- 普通说明文字：无关键字，不应被当卡片 -->
  <div class="row">填写说明：请如实填写以上各项信息</div>

  <!-- 超长描述性文字：超过 40 字，不应被当卡片 -->
  <div class="long">本段为一段很长的描述性文字，用来验证过长的文本块即便像一行也不会被当成可点卡片收进元素表，避免污染决策。</div>

  <!-- 强信号（手型光标）：即使没有入口关键字也应收为卡片 -->
  <div class="row pointer">查看详情</div>
</body>
</html>
